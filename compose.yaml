services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: watchdenchi
      POSTGRES_USER: watchdenchi
      POSTGRES_PASSWORD: ${WATCHDENCHI_DEV_DB_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${WATCHDENCHI_DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "watchdenchi", "-d", "watchdenchi"]
      interval: 2s
      timeout: 3s
      retries: 25

volumes:
  postgres-data:
