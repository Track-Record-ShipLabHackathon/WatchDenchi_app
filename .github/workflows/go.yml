name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchdenchi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WATCHDENCHI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/watchdenchi_test?sslmode=disable
    defaults:
      run:
        working-directory: BACK
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: BACK/go.mod
          cache: false
      - name: Build Go API
        run: go build ./...
      - name: Test API and PostgreSQL integration
        run: go test -race -count=1 -v ./...
