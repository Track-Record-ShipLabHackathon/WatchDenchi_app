name: Python Inference CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'inference/**'
      - '.github/workflows/inference.yml'
  push:
    branches: [main]
    paths:
      - 'inference/**'
      - '.github/workflows/inference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: inference

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.6'
          cache: pip
          cache-dependency-path: inference/requirements.lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v