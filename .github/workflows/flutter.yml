name: Flutter Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'FRONT/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'FRONT/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.0'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test Flutter
        run: flutter test --no-pub

      - name: Build Flutter Web
        run: >-
          flutter build web
          --no-pub
          --base-href /WatchDenchi_app/
          --dart-define=WATCHDENCHI_API_BASE_URL=https://watchdenchi-app.onrender.com
          --dart-define=WATCHDENCHI_ENABLE_SERVER_AUTH=false

      # Separate build: keep server inventory disabled on the normal page.
      # Both paths share the Origin allowed by the Go server.
      - name: Build API preview
        run: >-
          flutter build web
          --no-pub
          --output build/api-preview
          --base-href /WatchDenchi_app/api-preview/
          --dart-define=WATCHDENCHI_API_BASE_URL=https://watchdenchi-app.onrender.com
          --dart-define=WATCHDENCHI_ENABLE_SERVER_AUTH=true
          --dart-define=WATCHDENCHI_ENABLE_SERVER_INVENTORY=true

      - name: Include API preview in Pages artifact
        run: |
          mkdir -p build/web/api-preview
          cp -R build/api-preview/. build/web/api-preview/

      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: FRONT/build/web

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1